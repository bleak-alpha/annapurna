spring:
  application:
    name: annapurna-backend
  
  datasource:
    url: jdbc:postgresql://database:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080

# COMPLETELY DISABLE ACTUATOR AND METRICS
management:
  endpoints:
    enabled-by-default: false
  metrics:
    export:
      enabled: false
  endpoint:
    health:
      enabled: false

# Disable auto-configuration for actuator
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.MetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

logging:
  level:
    com.annapurna: INFO
    org.springframework: WARN