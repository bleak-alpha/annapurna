version: '3.8'

services:
  database:
    image: postgres:15
    container_name: annapurna_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - annapurna-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apps -d annapurna_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./annapurna-backend
      dockerfile: dockerfile
    container_name: annapurna_backend
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      SPRING_JPA_OPEN_IN_VIEW: false
      MANAGEMENT_METRICS_ENABLE_SYSTEM: false
      MANAGEMENT_METRICS_ENABLE_PROCESSOR: false
      MANAGEMENT_METRICS_ENABLE_PROCESS: false
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - annapurna-net
    restart: "no"  # Disable restart to see actual errors
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local

networks:
  annapurna-net:
    driver: bridge